<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار تك | لابتوبات مستعملة ومجددة في الأردن</title>
</head>
<body>
  <h1>مرحبًا بكم في اختيار تك</h1>
  <p>حالة الاتصال بقاعدة البيانات: <span id="status">جارٍ الفحص...</span></p>

  <script>
    window.onerror = function(msg) {
      document.getElementById('status').textContent = 'خطأ في الصفحة: ' + msg;
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    try {
      const supabaseUrl = 'https://ycntbxyssshlsxbaxugn.supabase.co';
      const supabaseKey = 'sb_publishable_wictDeASMg3TbeCffysizA_vAADTbVA';
      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      supabase.from('products').select('*').then(function(result) {
        const statusEl = document.getElementById('status');
        if (result.error) {
          statusEl.textContent = 'فشل الاتصال: ' + result.error.message;
        } else {
          statusEl.textContent = 'نجح الاتصال! عدد المنتجات حاليًا: ' + result.data.length;
        }
      });
    } catch (e) {
      document.getElementById('status').textContent = 'خطأ في التنفيذ: ' + e.message;
    }
  </script>
</body>
</html>
