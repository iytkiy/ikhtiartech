<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار تك | لابتوبات مستعملة ومجددة في الأردن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f1b3d;
      --green: #2ecc71;
      --white: #ffffff;
      --gray: #f4f6f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--gray);
      color: var(--navy);
    }
    header {
      background: var(--white);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header img { height: 42px; }
    .hero {
      background: var(--navy);
      color: var(--white);
      text-align: center;
      padding: 40px 20px;
    }
    .hero h1 { font-size: 24px; margin-bottom: 10px; }
    .hero p { font-size: 15px; opacity: 0.85; }
    main { padding: 20px; }
    #status {
      display: block;
      text-align: center;
      margin: 20px 0;
      color: #888;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--gray);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 12px;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
    }
    .card-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .card-specs { font-size: 11px; color: #666; }
    .card-price { color: var(--green); font-weight: 900; font-size: 16px; margin-top: auto; }
    .card-btn {
      display: block;
      text-align: center;
      background: var(--navy);
      color: var(--white);
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 6px;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--white);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--gray);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 16px;
      color: var(--navy);
    }
    .modal h2 { font-size: 18px; margin-bottom: 8px; padding-left: 30px; }
    .modal-price { color: var(--green); font-weight: 900; font-size: 20px; margin-bottom: 14px; }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray);
      font-size: 13px;
    }
    .spec-label { color: #888; }
    .spec-value { font-weight: 700; }
    .modal-btn {
      display: block;
      text-align: center;
      background: var(--green);
      color: var(--white);
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <header>
    <img src="FB_IMG_1790031755538.jpg" alt="اختيار تك">
  </header>

  <div class="hero">
    <h1>لابتوبك المناسب بسعر يناسبك</h1>
    <p>أجهزة مستعملة ومجددة بجودة موثوقة، لكل استخدام: دراسة، برمجة، تصميم وألعاب</p>
  </div>

  <main>
    <span id="status">جارٍ تحميل المنتجات...</span>
    <div class="grid" id="products"></div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('products');
    const overlayEl = document.getElementById('overlay');
    const modalEl = document.getElementById('modal');

    function specRow(label, value) {
      if (!value) return '';
      return `<div class="spec-row"><span class="spec-label">${label}</span><span class="spec-value">${value}</span></div>`;
    }

    function openModal(p) {
      const whatsappMsg = encodeURIComponent('مرحبًا، أريد الاستفسار عن جهاز ' + p.name + ' الموجود في متجر اختيار تك.');
      modalEl.innerHTML = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2>${p.name}</h2>
        <div class="modal-price">${p.price} د.أ</div>
        ${specRow('الشركة', p.brand)}
        ${specRow('الموديل', p.model)}
        ${specRow('المعالج', p.processor)}
        ${specRow('الجيل', p.generation)}
        ${specRow('الرام', p.ram)}
        ${specRow('التخزين', p.storage)}
        ${specRow('كرت الشاشة', p.gpu)}
        ${specRow('حجم الشاشة', p.screen_size)}
        ${specRow('الحالة', p.condition)}
        ${specRow('نظام التشغيل', p.os)}
        ${specRow('الضمان', p.warranty)}
        ${specRow('الملحقات', p.accessories)}
        ${specRow('مناسب لـ', p.category)}
        <a class="modal-btn" href="https://wa.me/?text=${whatsappMsg}">تواصل عبر واتساب</a>
      `;
      overlayEl.classList.add('open');
    }

    function closeModal() {
      overlayEl.classList.remove('open');
    }

    overlayEl.addEventListener('click', function(e) {
      if (e.target === overlayEl) closeModal();
    });

    function loadProducts() {
      try {
        if (typeof window.supabase === 'undefined') {
          statusEl.textContent = 'تعذّر تحميل مكتبة الاتصال (تحقق من الإنترنت وأعد المحاولة)';
          return;
        }

        const supabaseUrl = 'https://ycntbxyssshlsxbaxugn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbnRieHlzc3NobHN4YmF4dWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDk4ODksImV4cCI6MjEwNTU4NTg4OX0.VW1ta5s7ExdyuDyN-85PMB6isPzbMu43Ve1UQicl3tk';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        supabase.from('products').select('*').order('price', { ascending: true })
          .then(function(result) {
            if (result.error) {
              statusEl.textContent = 'خطأ من قاعدة البيانات: ' + result.error.message;
              return;
            }
            if (result.data.length === 0) {
              statusEl.textContent = 'لا توجد أجهزة معروضة حاليًا';
              return;
            }
            statusEl.style.display = 'none';

            result.data.forEach(function(p) {
              const card = document.createElement('div');
              card.className = 'card';
              const specs = [p.processor, p.ram, p.storage].filter(Boolean).join(' • ');
              card.innerHTML = `
                <div class="card-img">لا توجد صورة بعد</div>
                <div class="card-body">
                  <div class="card-name">${p.name}</div>
                  <div class="card-specs">${specs}</div>
                  <div class="card-price">${p.price} د.أ</div>
                </div>
              `;
              card.addEventListener('click', function() { openModal(p); });
              gridEl.appendChild(card);
            });
          })
          .catch(function(err) {
            statusEl.textContent = 'خطأ في الاتصال: ' + err.message;
          });
      } catch (e) {
        statusEl.textContent = 'خطأ في التنفيذ: ' + e.message;
      }
    }

    loadProducts();
  </script>
</body>
</html>
